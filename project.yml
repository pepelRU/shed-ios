name: Shed

options:
  bundleIdPrefix: dev.shed
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0

targets:
  Shed:
    type: application
    platform: iOS
    sources:
      - path: Shed
    dependencies:
      - package: SwiftSoup
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Shed
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.shed.schedule.refresh
        ITSAppUsesNonExemptEncryption: false
        UpdateManifestURL: "https://raw.githubusercontent.com/pepelnefor-del/shed-ios/main/update-ios.json"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shed.schedule
        PRODUCT_NAME: Shed
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Shed:
    build:
      targets:
        Shed: all
    run:
      config: Debug
    archive:
      config: Release
